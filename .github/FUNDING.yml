<style>
:root{--bg:#070611;--panel:#111020;--purple:#b84cff;--blue:#269cff;--gold:#f5d28a;--white:#fffaff;--muted:#c9c5d8}
*{box-sizing:border-box;scroll-behavior:smooth}
body{margin:0;font-family:Arial,Helvetica,sans-serif;background:radial-gradient(circle at 20% 0%,#24104a 0,#070611 35%,#03030a 100%);color:var(--white);line-height:1.6}
a{color:inherit;text-decoration:none}
.wrap{max-width:1150px;margin:auto;padding:0 22px}
header{position:sticky;top:0;z-index:10;background:rgba(5,5,14,.9);backdrop-filter:blur(14px);border-bottom:1px solid rgba(255,255,255,.1)}
nav{display:flex;align-items:center;justify-content:space-between;min-height:72px}
nav .links{display:flex;gap:22px;font-size:.92rem;font-weight:700}
nav .links a:hover{color:var(--gold)}
.btn{display:inline-block;padding:13px 22px;border-radius:999px;font-weight:800;background:linear-gradient(90deg,var(--purple),var(--blue));box-shadow:0 8px 30px rgba(122,55,255,.28)}
.btn.gold{background:linear-gradient(90deg,#e6b85d,#ffe8ad);color:#1a1220}
.hero{padding:90px 0 70px;text-align:center}
.eyebrow{letter-spacing:.22em;text-transform:uppercase;color:var(--gold);font-size:.8rem;font-weight:800}
h1{font-size:clamp(2.4rem,6vw,5rem);line-height:1.03;margin:12px 0 18px}
.gradient{background:linear-gradient(90deg,#d25aff,#7fc9ff,#f5d28a);-webkit-background-clip:text;background-clip:text;color:transparent}
.hero p{max-width:760px;margin:0 auto 28px;color:var(--muted);font-size:1.12rem}
.actions{display:flex;justify-content:center;gap:12px;flex-wrap:wrap}
section{padding:75px 0}
.section-title{text-align:center;max-width:760px;margin:0 auto 38px}
.section-title h2{font-size:2.25rem;margin:8px 0}
.section-title p{color:var(--muted)}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:18px}
.card{background:linear-gradient(145deg,rgba(28,25,48,.92),rgba(12,11,25,.92));border:1px solid rgba(196,104,255,.2);border-radius:22px;padding:25px;min-height:205px;box-shadow:0 12px 40px rgba(0,0,0,.22)}
.icon{font-size:2rem}
.card h3{margin:12px 0 7px}
.card p{margin:0;color:var(--muted);font-size:.94rem}
.services{grid-template-columns:repeat(2,1fr)}
.service-list{columns:2;padding-left:18px;color:var(--muted)}
.service-list li{margin:6px 0}
.feature{display:grid;grid-template-columns:1fr 1fr;gap:28px;align-items:center}
.feature-box{padding:35px;border-radius:28px;background:linear-gradient(145deg,rgba(74,24,112,.55),rgba(18,55,105,.4));border:1px solid rgba(255,255,255,.1)}
.quote{font-size:1.45rem;color:#fff}
.contact{display:grid;grid-template-columns:1fr 1fr;gap:28px}
.contact-box{padding:35px;border-radius:28px;background:#0e0d1c;border:1px solid rgba(245,210,138,.25)}
footer{border-top:1px solid rgba(255,255,255,.1);padding:28px 0;color:var(--muted);text-align:center}
.small{font-size:.88rem;color:var(--muted)}
@media(max-width:850px){.grid{grid-template-columns:repeat(2,1fr)}.services{grid-template-columns:1fr}.feature,.contact{grid-template-columns:1fr}.links{display:none!important}}
@media(max-width:520px){.grid{grid-template-columns:1fr}.service-list{columns:1}.hero{padding-top:55px}}
</style>
</head>
